            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .container {
            background-color: #ffffff; /* Tam beyaz kart arka planı */
            padding: 35px 30px;

            width: 90%;
            margin: 20px auto;
            /* Açılış Animasyonu Tanımı */
            animation: fadeIn 0.8s ease-out;
        }
        /* Yumuşak Açılış Animasyonu */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-img {
            width: 190px;
            height: auto;

            margin-bottom: 6px;
            font-weight: 800; 
            letter-spacing: 0.5px;
            text-transform: uppercase;

        .subtitle {

            font-size: 14px;
            margin-bottom: 25px; 
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .section-title {
            font-size: 12px;
            color: #94a3b8; 
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 20px 0 12px;
            text-align: left;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 5px;
            font-weight: 700;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            padding: 14px;
            margin: 12px 0;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(22, 163, 74, 0.15);
        }
        .btn:active { transform: scale(0.98); }
        
        /* Enerji Sektörüne Uygun Buton Renkleri */
        .btn-call { background-color: #16a34a; color: #ffffff; border: 2px solid #16a34a; } /* Doğa/Enerji Yeşili */
        .btn-mail { background-color: #475569; color: #ffffff; border: 2px solid #475569; } /* Modern Slate Gri */
        .btn-web { background-color: #0f172a; color: #ffffff; border: 2px solid #0f172a; }  /* Güçlü Koyu Slate */
        .btn-maps { background-color: #ffffff; color: #0f172a; border: 2px solid #0f172a; } /* Sade Çerçeveli Beyaz */
        
        /* Hover Efektleri */
        .btn-call:hover { background-color: #15803d; border-color: #15803d; }
        .btn-mail:hover { background-color: #334155; border-color: #334155; }
        .btn-web:hover { background-color: #1e293b; border-color: #1e293b; }
        .btn-maps:hover { background-color: #f8fafc; }
        
        /* Profesyonel Footer Alanı */
        .footer-wrapper {
            margin-top: 30px;
            border-top: 1px dashed #e2e8f0; 
            padding-top: 15px;
        }
        .legal-footer {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 500;
            margin-bottom: 3px;
        }
        .creator-tag {

            color: #cbd5e1; 
            text-decoration: none; 
            transition: color 0.2s ease; 
            display: inline-block;
            font-weight: 400;
        }
        .creator-tag span {
            font-weight: 700; 
            color: #94a3b8; 
        }
        .creator-tag:hover, .creator-tag:hover span {
            color: #16a34a; /* Üzerine gelince enerji yeşiline dönüşür */
